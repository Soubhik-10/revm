name: glamsterdam feature tests

on:
  push:
    branches: ["", "release/"]
  pull_request:
    branches: ["", "release/"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-glamsterdam:
    name: test with glamsterdam
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests with glamsterdam feature
        run: cargo test --workspace --features glamsterdam